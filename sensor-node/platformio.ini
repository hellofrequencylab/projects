; CyberUnicorn sensor node. Build with ./build.sh, not a bare `pio run`: the
; script pins PlatformIO and keeps the platform in a private core dir.
;
; Platform pinned to the same pioarduino release the hub (Bruce 1.16.1) builds
; with: Arduino-ESP32 3.3.9 on ESP-IDF 5.5.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0

; Any classic ESP32 dev board (ESP32-WROOM/WROVER DevKit, D1 mini32, ...).
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DNODE_I2C_SDA=21
    -DNODE_I2C_SCL=22
    -DNODE_BATTERY_PIN=34

; AIO Board V1.4's ESP32-S2, sensor on the "ESP32 LEADS OUT PINS" header.
; No battery measurement: none of the broken-out pins is on ADC1.
[env:aio-board-s2]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DNODE_I2C_SDA=35
    -DNODE_I2C_SCL=36
    -DNODE_BATTERY_PIN=-1
