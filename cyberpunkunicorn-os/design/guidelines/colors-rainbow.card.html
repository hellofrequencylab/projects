<!-- @dsCard group="Colors" viewport="700x200" name="Rainbow" subtitle="cyberHue(): full-saturation wheel, starts at hot pink" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body);font-size:20px}*{box-sizing:border-box}a{color:var(--cu-cyan)}a:hover{color:var(--cu-pink)}.w{display:flex;flex-direction:column;gap:10px;padding:16px}.bar{height:40px}.row{display:flex;gap:2px}.sky{flex:1;height:44px}</style></head><body><div class="w"><div class="bar" style="background:var(--cu-rainbow)"></div><div class="row" id="steps"></div><div class="row"><div class="sky" style="background:var(--cu-sky)"></div><div class="sky" style="background:var(--cu-sun)"></div></div></div><script>const h=x=>{x=((x%360)+360)%360;const s=Math.floor(x/60),f=Math.floor((x%60)*255/60);return [[255,f,0],[255-f,255,0],[0,255,f],[0,255-f,255],[f,0,255],[255,0,255-f]][s]};document.getElementById('steps').innerHTML=Array.from({length:12},(_,i)=>{const c=h(300+i*30);return '<div style="flex:1;height:28px;background:rgb('+c+')"></div>'}).join('')</script></body></html>
