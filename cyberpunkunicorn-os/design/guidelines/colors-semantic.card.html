<!-- @dsCard group="Colors" viewport="700x170" name="Semantic" subtitle="Aliases for screens and the web console" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body);font-size:20px}*{box-sizing:border-box}a{color:var(--cu-cyan)}a:hover{color:var(--cu-pink)}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;padding:16px}.s{display:flex;flex-direction:column;gap:3px}.sw{height:44px;border:1px solid #222}b{font-family:var(--font-display);font-size:7px;font-weight:400}i{font-style:normal;font-size:15px;color:var(--cu-lavender)}</style></head><body><div class="g"><div class="s"><div class="sw" style="background:var(--surface-screen)"></div><b>screen</b><i>--surface-screen</i></div><div class="s"><div class="sw" style="background:var(--surface-panel)"></div><b>panel</b><i>--surface-panel</i></div><div class="s"><div class="sw" style="background:var(--surface-floor)"></div><b>floor</b><i>--surface-floor</i></div><div class="s"><div class="sw" style="background:var(--text-primary)"></div><b>text</b><i>--text-primary</i></div><div class="s"><div class="sw" style="background:var(--text-muted)"></div><b>muted</b><i>--text-muted</i></div><div class="s"><div class="sw" style="background:var(--accent-primary)"></div><b>primary</b><i>--accent-primary</i></div><div class="s"><div class="sw" style="background:var(--accent-secondary)"></div><b>secondary</b><i>--accent-secondary</i></div><div class="s"><div class="sw" style="background:var(--accent-ok)"></div><b>ok</b><i>--accent-ok</i></div><div class="s"><div class="sw" style="background:var(--accent-warn)"></div><b>warn</b><i>--accent-warn</i></div></div></body></html>
