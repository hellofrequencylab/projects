<!-- @dsCard group="Colors" viewport="700x170" name="Synthwave scene" subtitle="Boot sky, sun, grid and icon extensions" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body);font-size:20px}*{box-sizing:border-box}a{color:var(--cu-cyan)}a:hover{color:var(--cu-pink)}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;padding:16px}.s{display:flex;flex-direction:column;gap:3px}.sw{height:44px;border:1px solid #222}b{font-family:var(--font-display);font-size:7px;font-weight:400}i{font-style:normal;font-size:15px;color:var(--cu-lavender)}</style></head><body><div class="g"><div class="s"><div class="sw" style="background:var(--cu-sky-top)"></div><b>D sky top</b><i>--cu-sky-top</i></div><div class="s"><div class="sw" style="background:var(--cu-sky-low)"></div><b>V sky low</b><i>--cu-sky-low</i></div><div class="s"><div class="sw" style="background:var(--cu-floor)"></div><b>N floor</b><i>--cu-floor</i></div><div class="s"><div class="sw" style="background:var(--cu-sun-mid)"></div><b>o sun mid</b><i>--cu-sun-mid</i></div><div class="s"><div class="sw" style="background:var(--cu-magenta)"></div><b>M grid rays</b><i>--cu-magenta</i></div><div class="s"><div class="sw" style="background:var(--cu-grid-blue)"></div><b>B grid</b><i>--cu-grid-blue</i></div><div class="s"><div class="sw" style="background:var(--cu-horizon)"></div><b>horizon</b><i>--cu-horizon</i></div><div class="s"><div class="sw" style="background:var(--cu-magenta-hot)"></div><b>glitch R</b><i>--cu-magenta-hot</i></div></div></body></html>
