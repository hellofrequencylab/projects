<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing and radius" subtitle="Small integer steps; square on device" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body);font-size:20px}*{box-sizing:border-box}a{color:var(--cu-cyan)}a:hover{color:var(--cu-pink)}.w{display:flex;align-items:flex-end;gap:16px;padding:20px;flex-wrap:wrap}.s{display:flex;flex-direction:column;align-items:center;gap:6px}i{font-style:normal;font-size:14px;color:var(--cu-lavender)}</style></head><body><div class="w"><div class="s"><div style="width:var(--space-1);height:var(--space-1);background:var(--cu-magenta)"></div><i>--space-1</i></div><div class="s"><div style="width:var(--space-2);height:var(--space-2);background:var(--cu-magenta)"></div><i>--space-2</i></div><div class="s"><div style="width:var(--space-3);height:var(--space-3);background:var(--cu-magenta)"></div><i>--space-3</i></div><div class="s"><div style="width:var(--space-4);height:var(--space-4);background:var(--cu-magenta)"></div><i>--space-4</i></div><div class="s"><div style="width:var(--space-5);height:var(--space-5);background:var(--cu-magenta)"></div><i>--space-5</i></div><div class="s"><div style="width:var(--space-6);height:var(--space-6);background:var(--cu-magenta)"></div><i>--space-6</i></div><div class="s"><div style="width:var(--space-7);height:var(--space-7);background:var(--cu-magenta)"></div><i>--space-7</i></div><div class="s"><div style="width:var(--space-8);height:var(--space-8);background:var(--cu-magenta)"></div><i>--space-8</i></div><div class="s"><div style="width:40px;height:30px;border:2px solid var(--cu-cyan);border-radius:var(--radius-chip)"></div><i>--radius-chip</i></div><div class="s"><div style="width:40px;height:30px;border:2px solid var(--cu-cyan);border-radius:var(--radius-card)"></div><i>--radius-card</i></div><div class="s"><div style="width:40px;height:30px;border:2px solid var(--cu-cyan);border-radius:var(--radius-screen)"></div><i>--radius-screen</i></div></div></body></html>
