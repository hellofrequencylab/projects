# Boot screen text for CyberUnicorn 5000. Edit, then ./build.sh && ./flash.sh
#
# BOOT_TITLE   — glitchy rainbow title across the top of the unicorn boot scene
#                (a superscript TM is drawn after it automatically)
# BOOT_TAGLINE — shown under the loading bar once it (over)reaches 100%
#
# Max 26 characters each. No double quotes, single quotes or backslashes.
# ASCII only (the built-in font has no other glyphs).

BOOT_TITLE="CYBERUNICORN 5000"
BOOT_TAGLINE="All systems fabulous."

# STARTUP_APP — app to boot straight into. Empty = normal menu. Valid names:
#   WebUI, Sniffer, Unicornagotchi, Wardriving, WardrivingWifiOnly, WardrivingBTEOnly,
#   Custom SubGHz, PN532 BLE, PN532 UART, JS Interpreter, Clock, Mass Storage
STARTUP_APP=""
# TRIM_UNUSED_MENUS — 1: hide FM/LoRa/Ethernet (no hardware on the hat); 0: show all
TRIM_UNUSED_MENUS=1
# TRIM_ABSENT_HARDWARE — 1: compile out code for hardware the CYD + hat don't have
#   (LoRa, Ethernet, FM transmitter, Chameleon/Amiibolink/PN532 BLE and UART gadgets).
#   Frees flash for our own apps. 0: keep it all (they then wait in the Library).
TRIM_ABSENT_HARDWARE=1
