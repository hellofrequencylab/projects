# Boot screen text for the custom Bruce build. Edit, then ./build.sh && ./flash.sh
#
# BOOT_TITLE   — large text at the top of the boot screen (stock: "Bruce")
# BOOT_TAGLINE — text along the bottom bar (stock: "PREDATORY FIRMWARE");
#                with BOOT_CAT_SCENE=1 it is also the caption under the cat
#
# Max 26 characters each (320 px landscape at the boot font's 12 px/char).
# No double quotes, single quotes or backslashes. ASCII only: the boot font has
# no glyphs for things like ™ — use BOOT_TRADEMARK instead.

BOOT_TITLE="Bruce"
BOOT_TAGLINE="PussyPower"

# BOOT_CAT_SCENE — 1: replace the stock Bruce logo animation with the "cat in
#                  space" scene (sprite from assets/cat_sprite.h); 0: stock animation.
#                  A boot.jpg/boot.gif on SD/LittleFS or a theme boot image still wins.
# BOOT_TRADEMARK — 1: draw a small superscript "TM" after the cat-scene caption; 0: none.
BOOT_CAT_SCENE=1
BOOT_TRADEMARK=1

# STARTUP_APP — app to boot straight into. Empty = normal menu. Valid names:
#   WebUI, Sniffer, Brucegotchi, Wardriving, WardrivingWifiOnly, WardrivingBTEOnly,
#   Custom SubGHz, PN532 BLE, PN532 UART, JS Interpreter, Clock, Mass Storage
STARTUP_APP="WebUI"
# TRIM_UNUSED_MENUS — 1: hide FM/LoRa/Ethernet (no hardware on the hat); 0: show all
TRIM_UNUSED_MENUS=1
